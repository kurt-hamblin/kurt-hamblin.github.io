title: Kurt Hamblin
author: Kurt Hamblin
description: Kurt Hamblin is a Physical Scientist at NOAA.
lang: en

# Switch to https://www.kurthamblin.com when the CNAME file is added.
url: "https://kurt-hamblin.github.io"
baseurl: ""

email: hamblin.kurt+website@gmail.com
github: https://github.com/kurt-hamblin
linkedin: https://www.linkedin.com/in/kurt-hamblin

permalink: pretty
markdown: kramdown

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Musings (blog). New posts go in _posts/ as YYYY-MM-DD-title.md.
feed:
  path: musings/feed.xml

# Projects. Each project is a file in _projects/ with `title`,
# `summary` (one line for the list), and `order`.
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /musings/:year/:title/
  - scope:
      path: ""
      type: projects
    values:
      layout: post

nav:
  - title: About
    url: /
  - title: Research
    url: /research/
  - title: Projects
    url: /projects/
  - title: Personal
    url: /personal/
  - title: Musings
    url: /musings/

exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .claude
  - Valithria_healing_final
